appId: dev.nedaa.android
---
# One-time capture setup: install a mushaf edition and clear the first-open
# walkthrough so the `quran` scene renders a bare reader page.
#
# Needed because shot.yaml's readiness marker is time-based — it fires ~900ms
# after navigation whatever the screen shows, so an uninstalled edition or an
# open sheet captures the wrong thing and still reports success. Every step is
# conditional, so re-running on an already-set-up simulator is a no-op.
- launchApp:
    clearState: false
# A cold launch is still painting when the conditionals below are evaluated, and
# `runFlow when visible` checks once — without this every step silently skips.
- waitForAnimationToEnd:
    timeout: 15000
# Play Services' Location Accuracy prompt covers the app on a fresh install and
# intercepts every tap beneath it. Declining is enough — screenshot mode seeds
# its own location.
- runFlow:
    when:
      visible:
        text: ".*No thanks.*"
    commands:
      - tapOn:
          text: ".*No thanks.*"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible:
        text: "Continue"
    commands:
      - tapOn:
          text: "Continue"
# Conditional: the reader hides the tab bar while it is open, so on a relaunch
# straight into the reader there is no tab to tap. Android exposes the tab as a
# plain "Quran" label, unlike iOS's "Quran, tab, 3 of 7".
- runFlow:
    when:
      visible:
        text: "Quran"
    commands:
      - tapOn:
          text: "Quran"
      # Opening the tab first fetches the content DB behind a loading gate; the
      # spinner counts as an animation, so this waits for the gate to resolve.
      - waitForAnimationToEnd:
          timeout: 60000
# V2 (Madinah Mushaf 1420) is the default edition — first in VERSION_ORDER — so
# the shot shows what a user actually lands on. ~109MB over the sim's network.
- runFlow:
    when:
      visible:
        text: ".*Choose Your Mushaf.*"
    commands:
      # Exact title: the wildcard form also matches the CTA below, which reads
      # "Download Madinah Mushaf 1420 · 114 MB", and the taps then land on the
      # wrong element without failing.
      - tapOn:
          text: "Madinah Mushaf 1420"
      - tapOn:
          text: "Download Madinah Mushaf 1420.*"
      - extendedWaitUntil:
          visible:
            text: ".*Start Reading.*"
          timeout: 900000
      - tapOn:
          text: ".*Start Reading.*"
      - waitForAnimationToEnd:
          timeout: 10000
# Let the reader settle first: `runFlow when visible` evaluates once, so without
# this the walkthrough is still animating in and the check silently skips.
- waitForAnimationToEnd:
    timeout: 8000
# The first-open walkthrough covers the page; dismissing it persists.
- runFlow:
    when:
      visible:
        text: ".*Got it.*"
    commands:
      - tapOn:
          text: ".*Got it.*"
      - waitForAnimationToEnd:
          timeout: 10000
