// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  // android.kotlinVersion in gradle.properties sets the Kotlin Gradle plugin
  // and the Compose compiler plugin, so the two always match.
  ext.kotlinVersion = findProperty('android.kotlinVersion')
  repositories {
    google()
    mavenCentral()
    if (System.getenv("BUILD_VARIANT") == "hms") {
      maven { url 'https://developer.huawei.com/repo/' }
    }
  }
  dependencies {
    // AGConnect requires the Android Gradle Plugin coordinate to carry its version explicitly.
    // It matches React Native's gradle/libs.versions.toml; the highest version wins.
    classpath('com.android.tools.build:gradle:9.2.1')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:compose-compiler-gradle-plugin')
    if (System.getenv("BUILD_VARIANT") == "hms") {
      classpath('com.huawei.agconnect:agcp:1.9.6.300')
    }
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    if (System.getenv("BUILD_VARIANT") == "hms") {
      maven { url 'https://developer.huawei.com/repo/' }
    }
  }

  if (System.getenv("BUILD_VARIANT") == "hms") {
    configurations.configureEach {
      resolutionStrategy.eachDependency { details ->
        if (details.requested.group in [
          'com.google.android.gms',
          'com.google.android.play',
          'com.google.firebase'
        ]) {
          throw new GradleException(
            "HMS builds cannot resolve Google mobile-service dependency ${details.requested}"
          )
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
