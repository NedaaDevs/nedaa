name: Build Android

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - preview
          - production
          - production-hms

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 📦 Setup Bun and dependencies
        uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository] -- actionlint rejects $/

      - name: 🏗 Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.11.0
          packager: "bun"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔧 Set Build Profile and Environment
        id: config
        env:
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

          # Store profiles ship an AAB; preview ships an APK.
          if [ "$PROFILE" == "production" ] || [ "$PROFILE" == "production-hms" ]; then
            echo "build_type=aab" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=apk" >> "$GITHUB_OUTPUT"
          fi

          if [ "$PROFILE" == "production-hms" ]; then
            echo "BUILD_VARIANT=hms" >> "$GITHUB_ENV"
          fi

      - name: 🔐 Prepare HMS AppGallery Connect config
        if: steps.config.outputs.profile == 'production-hms'
        env:
          AGCONNECT_SERVICES_JSON_CONTENT: ${{ secrets.AGCONNECT_SERVICES_JSON }}
        run: |
          if [ -z "$AGCONNECT_SERVICES_JSON_CONTENT" ]; then
            echo "AGCONNECT_SERVICES_JSON GitHub secret is required for production-hms" >&2
            exit 1
          fi
          AGCONNECT_PATH="$RUNNER_TEMP/agconnect-services.json"
          printf '%s' "$AGCONNECT_SERVICES_JSON_CONTENT" > "$AGCONNECT_PATH"
          chmod 600 "$AGCONNECT_PATH"
          echo "AGCONNECT_SERVICES_JSON=$AGCONNECT_PATH" >> "$GITHUB_ENV"

      - name: 🚀 Build Android Locally
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ steps.config.outputs.profile }}
          BUILD_TYPE: ${{ steps.config.outputs.build_type }}
        run: |
          OUTPUT="./build-output.$BUILD_TYPE"
          # A kept, fixed working dir leaves R8's mapping.txt where the upload step can find it.
          export EAS_LOCAL_BUILD_WORKINGDIR="$RUNNER_TEMP/eas-build"
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1
          echo "Building locally with profile: $PROFILE ($BUILD_TYPE)"

          eas build \
            --local \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --output "$OUTPUT"

          echo "build_output=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "build_size=$(du -h "$OUTPUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 📊 Verify Build Output
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build_output }}
          BUILD_SIZE: ${{ steps.build.outputs.build_size }}
        run: |
          if [ -f "$BUILD_OUTPUT" ]; then
            echo "✅ Build successful!"
            echo "📦 File: $BUILD_OUTPUT"
            echo "📏 Size: $BUILD_SIZE"
            echo "🔍 Type: $(file -b "$BUILD_OUTPUT")"
            # A listing alone passes a damaged entry; -t checks every CRC.
            unzip -tqq "$BUILD_OUTPUT"
            unzip -l "$BUILD_OUTPUT" | head -10
          else
            echo "❌ Build failed - no output file found"
            exit 1
          fi

      - name: 🛡 Verify HMS dependency graph and AAB
        if: steps.config.outputs.profile == 'production-hms'
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build_output }}
        run: bun scripts/verify-hms-build.ts "$BUILD_OUTPUT"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ steps.config.outputs.build_type }}-${{ steps.config.outputs.profile }}-${{ github.sha }}
          path: ${{ steps.build.outputs.build_output }}
          retention-days: 7
          compression-level: 6

      - name: 📤 Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping-${{ steps.config.outputs.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/eas-build/build/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
