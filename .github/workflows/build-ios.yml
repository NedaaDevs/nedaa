name: Build iOS

# Manual only: EAS signs remotely with the iOS credentials stored on EAS.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Queue iOS build on EAS
    runs-on: ubuntu-latest # EAS builds on its own macOS workers
    timeout-minutes: 15

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Setup Bun and dependencies
        uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository] -- actionlint rejects $/

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.11.0
          packager: "bun"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Queue iOS build
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          echo "Queueing iOS build with profile: $PROFILE"
          eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait --json > build_result.json
          BUILD_ID=$(jq -r '.[0].id' build_result.json)
          OWNER=$(jq -r '.expo.owner' app.json)
          SLUG=$(jq -r '.expo.slug' app.json)
          echo "Build queued: https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$BUILD_ID" | tee -a "$GITHUB_STEP_SUMMARY"
